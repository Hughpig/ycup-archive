<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>YCup 实时榜单</title>
    <!-- 引入 Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --ac-color: #c8e6c9;
        --wa-color: #ffcdd2;
        --bg-color: #f0f2f5;
      }
      body {
        font-family: "Segoe UI", "PingFang SC", system-ui, sans-serif;
        background: var(--bg-color);
        margin: 0;
        padding-bottom: 50px;
      }

      /* 头部容器 */
      .header-container {
        position: sticky;
        top: 0;
        z-index: 10;
        background: white;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        padding: 15px 30px;
      }
      .top-line {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      /* 赛事大时钟 */
      #liveClock {
        font-family: "Courier New", monospace;
        font-size: 7.5em;
        font-weight: 900;
        line-height: 1;
        margin: 5px 0;
      }
      .timer-before {
        color: #dc3545;
      }
      .timer-running {
        color: #28a745;
      }
      .timer-finished {
        color: #6c757d;
      }

      /* --- 勘误区 Markdown 样式 --- */
      .errata-section {
        margin: 15px 0;
        border-radius: 8px;
        overflow: hidden;
      }

      /* 预览区：大字号 */
      #errataPreview {
        background: #fff3cd;
        border-left: 12px solid #ffc107;
        padding: 20px 30px;
        font-size: 2.8em; /* 巨型字体 */
        font-weight: bold;
        color: #856404;
        min-height: 60px;
      }
      /* Markdown 内部元素微调 */
      #errataPreview p {
        margin: 0;
      }
      #errataPreview h1,
      #errataPreview h2 {
        margin: 10px 0;
      }
      #errataPreview ul {
        margin: 5px 0;
        padding-left: 40px;
      }

      /* 编辑区：仅在非锁定模式显示 */
      #errataEditArea {
        display: none;
        margin-top: 10px;
      }
      #errataText {
        width: 100%;
        height: 120px;
        font-family: monospace;
        font-size: 1.2em;
        padding: 10px;
        border: 2px dashed #ffc107;
        border-radius: 5px;
      }

      /* 模式控制 */
      .controls {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        align-items: center;
        padding-top: 15px;
        border-top: 1px solid #eee;
      }
      .lock-status {
        background: #333;
        color: white;
        padding: 8px 20px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
      }

      /* 表格样式 */
      .table-wrapper {
        padding: 20px 30px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        table-layout: fixed;
      }
      th,
      td {
        border: 1px solid #eee;
        padding: 15px 5px;
        text-align: center;
        font-size: 1.1em;
      }
      th {
        background: #222;
        color: white;
      }
      .team-name {
        text-align: left;
        padding-left: 20px;
        font-weight: bold;
        width: 250px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status-solved {
        background: var(--ac-color);
        color: #1b5e20;
        font-weight: 900;
      }
      .status-failed {
        background: var(--wa-color);
        color: #b71c1c;
      }

      /* 隐藏日志 */
      details.log-details {
        margin: 20px 30px;
        background: white;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      details.log-details summary {
        padding: 15px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1.2em;
      }
      .log-container {
        background: #1a1a1a;
        color: #00ff00;
        padding: 15px;
        font-family: monospace;
        height: 250px;
        overflow-y: auto;
      }

      /* 弹窗等 */
      #actionModal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        z-index: 100;
      }
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 99;
        backdrop-filter: blur(3px);
      }
      .locked #errataEditArea {
        display: none !important;
      }
      body:not(.locked) #errataEditArea {
        display: block;
      }
    </style>
  </head>
  <body class="locked">
    <div class="header-container">
      <div class="top-line">
        <div>
          <h1 id="mainTitle">YCup 实时榜单</h1>
          <div id="liveClock" class="timer-before">00:00:00</div>
        </div>
        <div class="lock-status" onclick="toggleLock()">
          <span id="lockIcon">🔒</span>
          <span id="lockText">只读模式 (点击解锁)</span>
          <input type="checkbox" id="editToggle" style="display: none" />
        </div>
      </div>

      <!-- 勘误区 -->
      <div class="errata-section">
        <div id="errataPreview"></div>
        <div id="errataEditArea">
          <textarea
            id="errataText"
            placeholder="支持 Markdown 语法 (例如: **Problem C** 题目描述勘误...)"
            oninput="updateErrataPreview()"
          ></textarea>
        </div>
      </div>

      <div class="controls">
        <div style="display: flex; gap: 10px">
          <label>开始:</label><input type="datetime-local" id="startTime" />
          <label>时长(min):</label
          ><input
            type="number"
            id="durationInput"
            value="300"
            style="width: 60px"
          />
          <label>题目:</label
          ><input
            type="number"
            id="probCountInput"
            value="10"
            style="width: 50px"
          />
          <button
            class="btn"
            onclick="updateProbCount()"
            style="background: #444; color: white"
          >
            应用配置
          </button>
        </div>
        <button
          class="btn"
          style="background: #007bff; color: white; padding: 8px 15px"
          onclick="addTeam()"
        >
          + 添加队伍
        </button>
        <button
          class="btn"
          onclick="undo()"
          style="background: #6c757d; color: white"
        >
          撤销(Ctrl+Z)
        </button>
        <button
          class="btn"
          id="scrollBtn"
          style="background: #17a2b8; color: white"
          onclick="toggleScroll()"
        >
          自动滚动
        </button>
        <button
          class="btn"
          style="background: #dc3545; color: white; margin-left: auto"
          onclick="clearData()"
        >
          清空全榜
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <table id="rankTable">
        <thead>
          <tr id="headerRow"></tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>

    <details class="log-details">
      <summary>📊 日志</summary>
      <div class="log-container" id="logBox"></div>
    </details>

    <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
    <div id="actionModal">
      <h2 id="modalTitle">操作面板</h2>
      <p id="modalInfo"></p>
      <div style="display: flex; flex-direction: column; gap: 15px">
        <button
          class="btn"
          style="
            background: #28a745;
            color: white;
            padding: 18px;
            font-size: 1.2em;
          "
          onclick="doAction('AC')"
        >
          通过 (AC)
        </button>
        <button
          class="btn"
          style="
            background: #dc3545;
            color: white;
            padding: 18px;
            font-size: 1.2em;
          "
          onclick="doAction('WA')"
        >
          错误 (WA +1)
        </button>
        <button
          class="btn"
          style="background: #6c757d; color: white; padding: 10px"
          onclick="doAction('RESET')"
        >
          重置题目
        </button>
        <button class="btn" onclick="closeModal()">取消</button>
      </div>
    </div>

    <script>
      let state = { teams: [], probCount: 10, history: [], logs: [] };
      let currentOp = { teamIdx: -1, probIdx: -1 };
      let scrollInterval = null;

      // --- Markdown & 勘误功能 ---
      function updateErrataPreview() {
        const text = document.getElementById("errataText").value;
        document.getElementById("errataPreview").innerHTML = marked.parse(
          text || "暂无公告",
        );
        localStorage.setItem("ycup_v6_errata", text);
      }

      // --- 计时器 ---
      function updateTimer() {
        const clockEl = document.getElementById("liveClock");
        const startStr = document.getElementById("startTime").value;
        const durationMin =
          parseInt(document.getElementById("durationInput").value) || 300;
        if (!startStr) {
          clockEl.innerText = "00:00:00";
          return;
        }

        const start = new Date(startStr).getTime();
        const end = start + durationMin * 60 * 1000;
        const now = Date.now();

        if (now < start) {
          clockEl.innerText = "-" + formatTime(start - now);
          clockEl.className = "timer-before";
        } else if (now < end) {
          clockEl.innerText = formatTime(end - now);
          clockEl.className = "timer-running";
        } else {
          clockEl.innerText = "Finished";
          clockEl.className = "timer-finished";
        }
      }

      function formatTime(ms) {
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 3600)
          .toString()
          .padStart(2, "0")}:${Math.floor((s % 3600) / 60)
          .toString()
          .padStart(2, "0")}:${(s % 60).toString().padStart(2, "0")}`;
      }
      setInterval(updateTimer, 1000);

      // --- 核心逻辑 (复用并增强) ---
      function toggleLock() {
        const cb = document.getElementById("editToggle");
        cb.checked = !cb.checked;
        document.body.className = cb.checked ? "" : "locked";
        document.getElementById("lockIcon").innerText = cb.checked
          ? "🔓"
          : "🔒";
        document.getElementById("lockText").innerText = cb.checked
          ? "管理模式 (可编辑)"
          : "只读模式 (点击解锁)";
      }

      function addLog(msg, type) {
        state.logs.unshift({
          t: new Date().toLocaleTimeString(),
          m: msg,
          type,
        });
        if (state.logs.length > 100) state.logs.pop();
        renderLogs();
      }

      function renderLogs() {
        document.getElementById("logBox").innerHTML = state.logs
          .map(
            (l) =>
              `<div style="color:${l.type === "WA" ? "#ff4444" : l.type === "AC" ? "#00ff00" : "#888"}">[${l.t}] ${l.m}</div>`,
          )
          .join("");
      }

      function saveState() {
        localStorage.setItem(
          "ycup_v6_data",
          JSON.stringify({
            teams: state.teams,
            probCount: state.probCount,
            logs: state.logs,
            duration: document.getElementById("durationInput").value,
            start: document.getElementById("startTime").value,
          }),
        );
      }

      function loadState() {
        const saved = JSON.parse(localStorage.getItem("ycup_v6_data") || "{}");
        if (saved.teams) {
          state.teams = saved.teams;
          state.probCount = saved.probCount;
          state.logs = saved.logs || [];
          document.getElementById("startTime").value = saved.start || "";
          document.getElementById("durationInput").value =
            saved.duration || 300;
          document.getElementById("probCountInput").value = state.probCount;
        }
        document.getElementById("errataText").value =
          localStorage.getItem("ycup_v6_errata") || "";
        updateErrataPreview();
        render();
        renderLogs();
      }

      function doAction(type) {
        const team = state.teams[currentOp.teamIdx];
        const prob = team.probs[currentOp.probIdx];
        state.history.push(
          JSON.stringify({ teams: state.teams, logs: state.logs }),
        );

        if (type === "AC") {
          prob.solved = true;
          const start = new Date(
            document.getElementById("startTime").value,
          ).getTime();
          prob.time = start ? Math.floor((Date.now() - start) / 60000) : 0;
          addLog(`${team.name} - 题目 ${currentOp.probIdx + 1} - AC`, "AC");
        } else if (type === "WA") {
          prob.wa++;
          addLog(`${team.name} - 题目 ${currentOp.probIdx + 1} - WA`, "WA");
        } else if (type === "RESET") {
          prob.solved = false;
          prob.wa = 0;
          prob.time = 0;
          addLog(
            `${team.name} - 题目 ${currentOp.probIdx + 1} - RESET`,
            "RESET",
          );
        }
        closeModal();
        render();
        saveState();
      }

      // (其他辅助函数: render, updateProbCount, addTeam, editName, undo, toggleScroll, clearData 等保持逻辑一致)
      function render() {
        const header = document.getElementById("headerRow");
        header.innerHTML =
          '<th style="width:60px">#</th><th class="team-name">Team Name</th>';
        for (let i = 1; i <= state.probCount; i++)
          header.innerHTML += `<th>${i}</th>`;
        header.innerHTML +=
          '<th style="width:80px">Solved</th><th style="width:100px">Penalty</th>';

        state.teams.forEach((t) => {
          t.sc = t.probs.filter((p) => p.solved).length;
          t.pt = t.probs.reduce(
            (s, p) => (p.solved ? s + p.time + p.wa * 20 : s),
            0,
          );
        });
        state.teams.sort(
          (a, b) => b.sc - a.sc || a.pt - b.pt || a.name.localeCompare(b.name),
        );

        const body = document.getElementById("rankBody");
        body.innerHTML = state.teams
          .map(
            (t, i) => `
            <tr>
                <td>${i + 1}</td>
                <td class="team-name" onclick="editName(${i})">${t.name}</td>
                ${t.probs
                  .map((p, pi) => {
                    let cls = p.solved
                      ? "status-solved"
                      : p.wa > 0
                        ? "status-failed"
                        : "";
                    let txt = p.solved
                      ? `+${p.wa || ""}<br><small>${p.time}</small>`
                      : p.wa > 0
                        ? `-${p.wa}`
                        : "";
                    return `<td class="problem-cell ${cls}" onclick="openModal(${i}, ${pi})">${txt}</td>`;
                  })
                  .join("")}
                <td style="font-weight:bold; font-size:1.2em">${t.sc}</td>
                <td style="color:#666">${t.pt}</td>
            </tr>
        `,
          )
          .join("");
      }

      function openModal(tIdx, pIdx) {
        if (!document.getElementById("editToggle").checked) return;
        currentOp = { teamIdx: tIdx, probIdx: pIdx };
        document.getElementById("modalInfo").innerText =
          `${state.teams[tIdx].name} | 题目 ${pIdx + 1}`;
        document.getElementById("overlay").style.display = "block";
        document.getElementById("actionModal").style.display = "block";
      }
      function closeModal() {
        document.getElementById("overlay").style.display = "none";
        document.getElementById("actionModal").style.display = "none";
      }
      function addTeam() {
        const n = prompt("队名:");
        if (n) {
          state.teams.push({
            name: n,
            probs: Array.from({ length: state.probCount }, () => ({
              solved: false,
              wa: 0,
              time: 0,
            })),
          });
          render();
          saveState();
        }
      }
      function editName(i) {
        if (!document.getElementById("editToggle").checked) return;
        const n = prompt("新队名:", state.teams[i].name);
        if (n) {
          state.teams[i].name = n;
          render();
          saveState();
        }
      }
      function undo() {
        if (state.history.length) {
          const last = JSON.parse(state.history.pop());
          state.teams = last.teams;
          state.logs = last.logs;
          render();
          renderLogs();
          saveState();
        }
      }
      function updateProbCount() {
        const c = parseInt(document.getElementById("probCountInput").value);
        state.teams.forEach((t) => {
          while (t.probs.length < c)
            t.probs.push({ solved: false, wa: 0, time: 0 });
          t.probs = t.probs.slice(0, c);
        });
        state.probCount = c;
        render();
        saveState();
      }
      function toggleScroll() {
        if (scrollInterval) {
          clearInterval(scrollInterval);
          scrollInterval = null;
        } else {
          scrollInterval = setInterval(() => {
            window.scrollBy(0, 1);
            if (
              window.scrollY + window.innerHeight >=
              document.documentElement.scrollHeight
            )
              window.scrollTo(0, 0);
          }, 30);
        }
      }
      function clearData() {
        if (confirm("确定清空数据？")) {
          localStorage.clear();
          location.reload();
        }
      }

      window.onload = loadState;
      window.onkeydown = (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "z") undo();
      };
    </script>
  </body>
</html>
