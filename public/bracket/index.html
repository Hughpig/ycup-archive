<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>六强淘汰赛对阵图</title>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.bracket {
    display: flex;
    align-items: flex-start;
    gap: 50px;
    background: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}
.round {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 240px;
}
.title {
    font-size: 14px;
    color: #909399;
    letter-spacing: 1px;
    margin-bottom: 20px;
    font-weight: bold;
    text-align: center;
}
/* 核心修正：所有轮次容器高度统一，实现完美的树状垂直对齐 */
.match-list {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    height: 320px;
    width: 100%;
}
.match {
    background: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    box-sizing: border-box;
    overflow: hidden;
    width: 100%;
}
.team {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid #f0f0f0;
    gap: 8px;
}
.team:last-child {
    border-bottom: none;
}
.team-name-wrapper {
    display: flex;
    align-items: center;
    flex-grow: 1;
    overflow: hidden;
}
.team input {
    border: none;
    background: transparent;
    font-size: 14px;
    width: 100%;
    color: #333;
    font-weight: 500;
}
.team input:focus {
    outline: none;
    background: #eef2ff;
    border-radius: 2px;
}
.seed {
    font-size: 11px;
    color: #888;
    background: #eee;
    padding: 2px 5px;
    border-radius: 3px;
    margin-right: 8px;
    flex-shrink: 0;
}
.adv-btn {
    background: #fff;
    border: 1px solid #dcdfe6;
    color: #606266;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
}
.adv-btn:hover {
    background: #409eff;
    border-color: #409eff;
    color: #fff;
}
.champion-box {
    border-color: #e6a23c;
    background: #fdf6ec;
}
.champion-box input {
    text-align: center;
    color: #e6a23c;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="bracket">
<div class="round">
    <div class="title">1/4 决赛</div>
    <div class="match-list">
        <div class="match">
            <div class="team">
                <div class="team-name-wrapper"><span class="seed">4</span><input type="text" id="t4" value="王以神了"></div>
                <button class="adv-btn" onclick="advance('t4', 'm1_p2')">晋级</button>
            </div>
            <div class="team">
                <div class="team-name-wrapper"><span class="seed">5</span><input type="text" id="t5" value="SLD 战队"></div>
                <button class="adv-btn" onclick="advance('t5', 'm1_p2')">晋级</button>
            </div>
        </div>
        <div class="match">
            <div class="team">
                <div class="team-name-wrapper"><span class="seed">3</span><input type="text" id="t3" value="还没想好队名"></div>
                <button class="adv-btn" onclick="advance('t3', 'm2_p2')">晋级</button>
            </div>
            <div class="team">
                <div class="team-name-wrapper"><span class="seed">6</span><input type="text" id="t6" value="0D000721"></div>
                <button class="adv-btn" onclick="advance('t6', 'm2_p2')">晋级</button>
            </div>
        </div>
    </div>
</div>

<div class="round">
    <div class="title">半决赛</div>
    <div class="match-list">
        <div class="match">
            <div class="team">
                <div class="team-name-wrapper"><span class="seed">1</span><input type="text" id="t1" value="牛大队"></div>
                <button class="adv-btn" onclick="advance('t1', 'f_p1')">晋级</button>
            </div>
            <div class="team">
                <div class="team-name-wrapper"><span class="seed">W</span><input type="text" id="m1_p2" value="4vs5 胜者" readonly></div>
                <button class="adv-btn" onclick="advance('m1_p2', 'f_p1')">晋级</button>
            </div>
        </div>
        <div class="match">
            <div class="team">
                <div class="team-name-wrapper"><span class="seed">2</span><input type="text" id="t2" value="想得出队名"></div>
                <button class="adv-btn" onclick="advance('t2', 'f_p2')">晋级</button>
            </div>
            <div class="team">
                <div class="team-name-wrapper"><span class="seed">W</span><input type="text" id="m2_p2" value="3vs6 胜者" readonly></div>
                <button class="adv-btn" onclick="advance('m2_p2', 'f_p2')">晋级</button>
            </div>
        </div>
    </div>
</div>

<div class="round">
    <div class="title">总决赛</div>
    <div class="match-list">
        <div class="match">
            <div class="team">
                <div class="team-name-wrapper"><span class="seed">F</span><input type="text" id="f_p1" value="半决赛1 胜者" readonly></div>
                <button class="adv-btn" onclick="advance('f_p1', 'champion')">夺冠</button>
            </div>
            <div class="team">
                <div class="team-name-wrapper"><span class="seed">F</span><input type="text" id="f_p2" value="半决赛2 胜者" readonly></div>
                <button class="adv-btn" onclick="advance('f_p2', 'champion')">夺冠</button>
            </div>
        </div>
    </div>
</div>

<div class="round">
    <div class="title">冠军</div>
    <div class="match-list">
        <div class="match champion-box">
            <div class="team" style="justify-content: center; padding: 15px;">
                🏆&nbsp;<input type="text" id="champion" value="未决出" readonly style="width: 120px;">
            </div>
        </div>
    </div>
</div>
</div>

<script>
function advance(fromId, toId) {
    var fromEl = document.getElementById(fromId);
    var toEl = document.getElementById(toId);
    if (fromEl && toEl) {
        toEl.value = fromEl.value;
    }
}
</script>

</body>
</html>
