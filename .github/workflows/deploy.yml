name: Deploy YCup to Cloudflare Pages

on:
  push:
    branches: [main]

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply ycup --remote
      - name: Build VitePress
        run: pnpm docs:build
      - name: Deploy Pages
        run: pnpm exec wrangler pages deploy .vitepress/dist --project-name ycup-archive
      - name: Deploy scheduler
        run: pnpm exec wrangler deploy --config scheduler/wrangler.jsonc
